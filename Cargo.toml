[package]
name = "midx"
version = "0.1.0"
edition = "2024"
description = "Offline-first local semantic indexer and search CLI for Markdown note repositories"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
pulldown-cmark = "0.13"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
